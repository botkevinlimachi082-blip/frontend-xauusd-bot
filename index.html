<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oro Signals MT5</title>

    <!-- Telegram Web Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0b0e14;
            --card: #1e2329;
            --border: #2b313a;
            --gold: #f0b90b;
            --gold-dark: #d49b00;
            --text: #eaedeb;
            --muted: #8b95a5;
            --green: #0ecb81;
            --red: #f6465d;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            min-height: 100vh;
            padding: 30px 16px 40px;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 630px;
            margin: 0 auto;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: clamp(25px, 6vw, 36px);
            font-weight: 800;
            color: var(--gold);
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .header p {
            font-size: clamp(15px, 4vw, 19px);
            color: var(--muted);
        }

        /* =========================
           BUTTON
        ========================= */

        .btn-analizar {
            width: 100%;
            min-height: 82px;

            background: linear-gradient(
                135deg,
                #ffc400,
                var(--gold),
                var(--gold-dark)
            );

            color: #000;

            border: none;
            border-radius: 18px;

            font-size: clamp(21px, 5vw, 28px);
            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 6px 20px rgba(240, 185, 11, 0.30),
                0 0 35px rgba(240, 185, 11, 0.08);

            transition:
                transform 0.12s ease,
                opacity 0.2s ease;
        }

        .btn-analizar:active {
            transform: scale(0.98);
        }

        .btn-analizar:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        /* =========================
           RESULT CARD
        ========================= */

        .card-result {
            background: var(--card);

            border: 1px solid var(--border);
            border-radius: 22px;

            padding: 38px 40px 28px;

            margin-top: 38px;

            text-align: left;

            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.25);
        }

        /* =========================
           SIGNAL
        ========================= */

        .signal-badge {
            width: 100%;

            min-height: 116px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 17px;

            font-size: clamp(31px, 8vw, 43px);
            font-weight: 800;

            margin-bottom: 38px;

            text-align: center;

            transition:
                background 0.25s ease,
                color 0.25s ease,
                border 0.25s ease;
        }

        .espera {
            background: rgba(240, 185, 11, 0.15);
            color: var(--gold);
            border: 2px solid var(--gold);
        }

        .compra {
            background: rgba(14, 203, 129, 0.15);
            color: var(--green);
            border: 2px solid var(--green);
        }

        .venta {
            background: rgba(246, 70, 93, 0.15);
            color: var(--red);
            border: 2px solid var(--red);
        }

        /* =========================
           DATA ROWS
        ========================= */

        .data-row {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;

            min-height: 76px;

            border-bottom: 1px solid var(--border);
        }

        .data-label {
            color: var(--muted);
            font-size: clamp(16px, 4.5vw, 21px);
        }

        .data-value {
            color: var(--text);
            font-size: clamp(17px, 4.5vw, 22px);
            font-weight: 750;
            text-align: right;
        }

        .price-value {
            font-size: clamp(27px, 7vw, 35px);
            font-weight: 850;
        }

        /* =========================
           API STATUS
        ========================= */

        .api-status {
            text-align: center;
            margin-top: 32px;

            color: var(--green);

            font-size: clamp(17px, 4.5vw, 21px);
            font-weight: 500;
        }

        .api-dot {
            display: inline-block;

            width: 11px;
            height: 11px;

            background: var(--green);

            border-radius: 50%;

            margin-right: 7px;

            box-shadow: 0 0 10px rgba(14, 203, 129, 0.7);
        }

        .api-error {
            color: var(--red);
        }

        .api-error .api-dot {
            background: var(--red);
            box-shadow: 0 0 10px rgba(246, 70, 93, 0.7);
        }

        /* =========================
           COUNTDOWN
        ========================= */

        .countdown {
            text-align: center;

            color: var(--gold);

            font-size: clamp(17px, 4.5vw, 21px);

            margin-top: 20px;
        }

        /* =========================
           FOOTER TIME
        ========================= */

        .footer-time {
            text-align: center;

            margin-top: 30px;

            font-size: 13px;

            color: #535b68;
        }

        /* =========================
           LOADING
        ========================= */

        .loading {
            animation: pulse 1.2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.45;
            }

            100% {
                opacity: 1;
            }
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 480px) {

            body {
                padding: 25px 12px 35px;
            }

            .card-result {
                padding: 30px 24px 25px;
                margin-top: 30px;
            }

            .data-row {
                min-height: 70px;
            }

            .signal-badge {
                min-height: 100px;
                margin-bottom: 28px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- =========================
         HEADER
    ========================= -->

    <div class="header">

        <h1>
            ⚡ XAUUSD (Oro) MT5 Signals
        </h1>

        <p>
            Análisis en tiempo real para MetaTrader 5
        </p>

    </div>


    <!-- =========================
         BUTTON
    ========================= -->

    <button
        id="btnAnalizar"
        class="btn-analizar"
        onclick="pedirSenal()"
    >
        BUSCAR SEÑAL
    </button>


    <!-- =========================
         RESULTADO
    ========================= -->

    <div
        id="cardResult"
        class="card-result"
    >

        <!-- SEÑAL -->

        <div
            id="signalBadge"
            class="signal-badge espera"
        >
            ESPERAR ⏳
        </div>


        <!-- ACTIVO -->

        <div class="data-row">

            <span class="data-label">
                Activo:
            </span>

            <span
                id="valSymbol"
                class="data-value"
            >
                XAU/USD
            </span>

        </div>


        <!-- PRECIO -->

        <div class="data-row">

            <span class="data-label">
                Precio Actual:
            </span>

            <span
                id="valPrice"
                class="data-value price-value"
            >
                $0.00
            </span>

        </div>


        <!-- EMA -->

        <div class="data-row">

            <span class="data-label">
                EMA 9:
            </span>

            <span
                id="valEma"
                class="data-value"
            >
                --
            </span>

        </div>


        <!-- RSI -->

        <div class="data-row">

            <span class="data-label">
                RSI:
            </span>

            <span
                id="valRsi"
                class="data-value"
            >
                --
            </span>

        </div>


        <!-- BANDA INFERIOR -->

        <div class="data-row">

            <span class="data-label">
                Banda inferior:
            </span>

            <span
                id="valLower"
                class="data-value"
            >
                --
            </span>

        </div>


        <!-- BANDA SUPERIOR -->

        <div class="data-row">

            <span class="data-label">
                Banda superior:
            </span>

            <span
                id="valUpper"
                class="data-value"
            >
                --
            </span>

        </div>


        <!-- TIMEFRAME -->

        <div class="data-row">

            <span class="data-label">
                Timeframe:
            </span>

            <span
                id="valTimeframe"
                class="data-value"
            >
                1min
            </span>

        </div>


        <!-- PLATAFORMA -->

        <div class="data-row">

            <span class="data-label">
                Plataforma:
            </span>

            <span class="data-value">
                MetaTrader 5
            </span>

        </div>


        <!-- API STATUS -->

        <div
            id="apiStatus"
            class="api-status"
        >
            <span class="api-dot"></span>
            API conectada
        </div>


        <!-- COUNTDOWN -->

        <div
            id="countdown"
            class="countdown"
        >
            Próxima actualización en 60s
        </div>


        <!-- HORA -->

        <div
            id="valTime"
            class="footer-time"
        >
            Última consulta: --
        </div>

    </div>

</div>


<script>

    /* =====================================================
       TELEGRAM WEB APP
    ===================================================== */

    const tg = window.Telegram
        ? window.Telegram.WebApp
        : null;

    if (tg) {

        tg.ready();
        tg.expand();

    }


    /* =====================================================
       API DE RENDER
    ===================================================== */

    const API_URL =
        "https://api-xauusd-bot.onrender.com/";


    /* =====================================================
       ELEMENTOS
    ===================================================== */

    const card =
        document.getElementById("cardResult");

    const badge =
        document.getElementById("signalBadge");

    const priceElem =
        document.getElementById("valPrice");

    const emaElem =
        document.getElementById("valEma");

    const rsiElem =
        document.getElementById("valRsi");

    const lowerElem =
        document.getElementById("valLower");

    const upperElem =
        document.getElementById("valUpper");

    const symbolElem =
        document.getElementById("valSymbol");

    const timeframeElem =
        document.getElementById("valTimeframe");

    const timeElem =
        document.getElementById("valTime");

    const apiStatus =
        document.getElementById("apiStatus");

    const countdownElem =
        document.getElementById("countdown");

    const button =
        document.getElementById("btnAnalizar");


    /* =====================================================
       VARIABLES
    ===================================================== */

    let segundosRestantes = 60;

    let countdownInterval = null;

    let actualizando = false;


    /* =====================================================
       FORMATEAR NUMERO
    ===================================================== */

    function numero(valor, decimales = 2) {

        if (
            valor === undefined ||
            valor === null ||
            valor === "" ||
            isNaN(Number(valor))
        ) {

            return "--";

        }

        return Number(valor).toFixed(decimales);

    }


    /* =====================================================
       HORA
    ===================================================== */

    function obtenerHora() {

        return new Date().toLocaleTimeString(
            "es-ES",
            {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit"
            }
        );

    }


    /* =====================================================
       VIBRACIÓN TELEGRAM
    ===================================================== */

    function vibrar(tipo) {

        try {

            if (
                tg &&
                tg.HapticFeedback
            ) {

                tg.HapticFeedback
                    .notificationOccurred(tipo);

            }

        } catch (e) {

            console.log(
                "Haptic no disponible"
            );

        }

    }


    /* =====================================================
       ACTUALIZAR SEÑAL
    ===================================================== */

    function actualizarBadge(signal) {

        const texto =
            String(signal || "ESPERAR ⏳");

        const mayusculas =
            texto.toUpperCase();


        badge.className =
            "signal-badge";


        /* COMPRA */

        if (
            mayusculas.includes("COMPRA") ||
            mayusculas.includes("BUY")
        ) {

            badge.classList.add("compra");

            badge.innerText =
                "COMPRA 🟢";

            vibrar("success");

            return;

        }


        /* VENTA */

        if (
            mayusculas.includes("VENTA") ||
            mayusculas.includes("SELL")
        ) {

            badge.classList.add("venta");

            badge.innerText =
                "VENTA 🔴";

            vibrar("warning");

            return;

        }


        /* ESPERAR */

        badge.classList.add("espera");

        badge.innerText =
            "ESPERAR ⏳";

    }


    /* =====================================================
       MOSTRAR ERROR
    ===================================================== */

    function mostrarError(error) {

        console.error(
            "Error API:",
            error
        );


        badge.className =
            "signal-badge venta";

        badge.innerText =
            "ERROR DE CONEXIÓN ❌";


        priceElem.innerText =
            "N/A";


        apiStatus.className =
            "api-status api-error";


        apiStatus.innerHTML =
            '<span class="api-dot"></span> API desconectada';


        timeElem.innerText =
            "No se pudo consultar la API";


        countdownElem.innerText =
            "Reintentando en 60s";

    }


    /* =====================================================
       PEDIR SEÑAL
    ===================================================== */

    async function pedirSenal() {

        if (actualizando) {

            return;

        }


        actualizando = true;

        button.disabled = true;


        /* MOSTRAR TARJETA */

        card.style.display =
            "block";


        /* ESTADO CARGANDO */

        badge.className =
            "signal-badge espera loading";

        badge.innerText =
            "ANALIZANDO MERCADO...";


        try {

            const response =
                await fetch(
                    API_URL,
                    {
                        method: "GET",

                        headers: {
                            "Accept":
                                "application/json"
                        },

                        cache: "no-store"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "HTTP " +
                    response.status
                );

            }


            const data =
                await response.json();


            console.log(
                "Datos recibidos:",
                data
            );


            /* =================================================
               SOPORTAR LOS NOMBRES DE TU API
            ================================================= */

            const price =
                data.price ??
                data.precio ??
                0;


            const signal =
                data.signal ??
                data.senal ??
                data.señal ??
                "ESPERAR";


            const ema =
                data.ema9 ??
                data.ema_9 ??
                data.ema ??
                null;


            const rsi =
                data.rsi ??
                null;


            const lower =
                data.lower_band ??
                data.lowerBand ??
                data.banda_inferior ??
                data.bandaInferior ??
                null;


            const upper =
                data.upper_band ??
                data.upperBand ??
                data.banda_superior ??
                data.bandaSuperior ??
                null;


            const symbol =
                data.symbol ??
                data.simbolo ??
                "XAU/USD";


            const timeframe =
                data.timeframe ??
                data.time_frame ??
                "1min";


            /* =================================================
               MOSTRAR DATOS
            ================================================= */

            priceElem.innerText =
                "$" +
                numero(price, 2);


            emaElem.innerText =
                numero(ema, 2);


            rsiElem.innerText =
                numero(rsi, 2);


            lowerElem.innerText =
                numero(lower, 2);


            upperElem.innerText =
                numero(upper, 2);


            symbolElem.innerText =
                symbol === "XAUUSD"
                    ? "XAU/USD"
                    : symbol;


            timeframeElem.innerText =
                timeframe;


            /* =================================================
               SEÑAL
            ================================================= */

            actualizarBadge(
                signal
            );


            /* =================================================
               API CONECTADA
            ================================================= */

            apiStatus.className =
                "api-status";

            apiStatus.innerHTML =
                '<span class="api-dot"></span> API conectada';


            /* =================================================
               HORA
            ================================================= */

            timeElem.innerText =
                "Última consulta: " +
                obtenerHora();


            /* =================================================
               REINICIAR CONTADOR
            ================================================= */

            iniciarContador();


        } catch (error) {

            mostrarError(error);

        } finally {

            actualizando = false;

            button.disabled = false;

        }

    }


    /* =====================================================
       CONTADOR DE 60 SEGUNDOS
    ===================================================== */

    function iniciarContador() {

        segundosRestantes = 60;


        actualizarTextoContador();


        if (countdownInterval) {

            clearInterval(
                countdownInterval
            );

        }


        countdownInterval =
            setInterval(
                function () {

                    segundosRestantes--;


                    actualizarTextoContador();


                    if (
                        segundosRestantes <= 0
                    ) {

                        clearInterval(
                            countdownInterval
                        );


                        /* ACTUALIZAR AUTOMÁTICAMENTE */

                        pedirSenal();

                    }

                },
                1000
            );

    }


    /* =====================================================
       TEXTO DEL CONTADOR
    ===================================================== */

    function actualizarTextoContador() {

        countdownElem.innerText =
            "Próxima actualización en " +
            segundosRestantes +
            "s";

    }


    /* =====================================================
       INICIAR
    ===================================================== */

    window.addEventListener(
        "load",
        function () {

            /*
             * Consulta automáticamente al abrir
             * la aplicación.
             */

            pedirSenal();

        }
    );

</script>

</body>
</html>
